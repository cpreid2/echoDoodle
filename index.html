<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>echoDoodle</title>
  <style>
    :root {
      --bg: #0a0a0c;

      /* Dark molded-plastic console palette (blends with the canvas) */
      --plastic-bay: linear-gradient(180deg, #191a1d 0%, #101012 30%, #151517 100%);
      --plastic-raised: linear-gradient(180deg, #1d1d21 0%, #141416 100%);
      --plastic-btn: linear-gradient(180deg, #232327 0%, #141417 100%);
      --plastic-btn-hover: linear-gradient(180deg, #2c2c32 0%, #1b1b1f 100%);
      --plate-dark: linear-gradient(180deg, #121214 0%, #08080a 100%);
      --screen: linear-gradient(180deg, #0d0d0f 0%, #141416 100%);

      --ink: #f4f1ea;
      --ink-muted: #b6b2a8;
      --plate-text: #f4f1ea;
      --gold: #ffd54a;

      /* 3D bevel border sets for dark plastic (top right bottom left) */
      --bevel-raised: #3a3a42 #0a0a0c #040405 #26262c;
      --bevel-inset: #040405 #26262c #3a3a42 #0a0a0c;

      /* Old-school Matrix-green LED indicators */
      --led-on: #00ff41;
      --led-off: #0d3018;
      --led-glow: rgba(0, 255, 65, 0.7);
      /* Soft phosphor LCD readout */
      --lcd-bg: linear-gradient(180deg, #17201a 0%, #101610 100%);
      --lcd-text: #8ff0a8;
      /* Muted slider fill that fits the dark console */
      --slider-fill: #3c7a52;

      /* Follows the brush color at runtime (see JS) */
      --playhead-color: #ffffff;

      /* Self-contained retro type — no external fonts */
      --font-mono: "Courier New", Courier, "Lucida Console", monospace;
      --font-display: "Courier New", Courier, "Lucida Console", monospace;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg); overflow: hidden;
      font-family: var(--font-mono);
      touch-action: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid Background - Always ON */
    #grid-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg);
      /* background-size is now handled dynamically in JS for a perfect fit */
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      z-index: 0;
    }

    #glcanvas {
      width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0;
      z-index: 1; background: transparent;
      /* Hide the system cursor so the brush preview ring acts as the cursor */
      cursor: none;
    }

    /* Pen-path editing overlay (drawn in 2D, sits above the GL canvas) */
    #pen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; pointer-events: none; display: none;
    }

    /* Brush preview ring that follows the cursor before drawing */
    #brush-preview {
      position: fixed; left: 0; top: 0; z-index: 5;
      border-radius: 50%; border: 1.5px solid #fff;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none; box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }

    /* --- Bottom UI Layout: molded-plastic console bay --- */
    #bottom-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 96%; max-width: 900px; z-index: 10;
      background: var(--plastic-bay);
      color: var(--ink);
      padding: 14px 20px 18px 20px;
      border-radius: 16px;
      border: 3px solid; border-color: var(--bevel-inset);
      box-shadow:
        inset 0 3px 8px rgba(0,0,0,0.4),
        inset 0 -1px 2px rgba(255,255,255,0.08),
        inset 3px 0 5px rgba(0,0,0,0.12),
        inset -2px 0 4px rgba(0,0,0,0.1),
        0 12px 34px rgba(0,0,0,0.55);
      display: flex; flex-direction: column; gap: 16px;
      touch-action: auto;
      transition: padding 0.3s ease;
    }
    /* Subtle molded-plastic grain */
    #bottom-panel::before {
      content: ""; position: absolute; inset: 0; border-radius: 13px;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.015) 1px, rgba(0,0,0,0.015) 2px),
        repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(0,0,0,0.01) 1px, rgba(0,0,0,0.01) 2px);
      pointer-events: none; z-index: 0;
    }
    #bottom-panel > * { position: relative; z-index: 1; }

    /* Top row holding timeline and minimize button */
    #panel-header {
      display: flex; align-items: center; gap: 12px; width: 100%;
    }

    /* Quantized Timeline — recessed LED strip */
    #timeline-container {
      display: flex; gap: 2px; height: 22px; flex-grow: 1;
      padding: 4px 5px; border-radius: 6px;
      background: linear-gradient(180deg, #0c0c0e 0%, #17171a 100%);
      border: 2px solid; border-color: #050506 #35353a #3a3a40 #0a0a0c;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.25);
    }

    /* Each segment is a flat LED cell: dim when off, glowing when lit.
       The dark housing gap between cells keeps them distinct at any frame count. */
    .frame-step {
      flex: 1 1 0; min-width: 2px; border-radius: 1px;
      background: var(--led-off);
      cursor: pointer;
      transition: background 0.08s ease, box-shadow 0.08s ease;
    }

    .frame-step:hover {
      background: #1f6b34;
    }

    /* Lit LED (playhead) — bright green core with a soft bloom (paused) */
    .frame-step.active {
      background: radial-gradient(circle at 50% 45%, #9dffb5 0%, #2bff5f 50%, var(--led-on) 100%);
      box-shadow: 0 0 7px 1px var(--led-glow);
      position: relative; z-index: 2;
    }

    /* While playing, the travelling playhead is a solid bright green (no hot core) */
    #bottom-panel.playing .frame-step.active {
      background: var(--led-on);
      box-shadow: 0 0 6px 1px var(--led-glow);
    }

    /* Per-frame edit mode indicators */
    #bottom-panel.editing .frame-step.active {
      background: radial-gradient(circle at 50% 45%, #d6ffe0 0%, #2bff5f 50%, var(--led-on) 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.7), 0 0 9px 1px var(--led-glow);
    }
    #bottom-panel.editing #play-btn {
      border-color: #b8860b;
      color: var(--gold);
    }

    /* Play / Pause Button — transport key */
    #play-btn {
      background: var(--plastic-btn);
      border: 2px solid; border-color: var(--bevel-raised);
      color: var(--ink); border-radius: 7px; cursor: pointer;
      width: 40px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.16);
      transition: all 0.1s ease;
    }
    #play-btn:hover { background: var(--plastic-btn-hover); }
    #play-btn:active { transform: translateY(1px); box-shadow: inset 1px 2px 4px rgba(0,0,0,0.35); border-color: var(--bevel-inset); }
    #play-btn svg { width: 12px; height: 12px; fill: currentColor; }

    /* Minimize Button */
    #minimize-btn {
      background: var(--plastic-btn);
      border: 2px solid; border-color: var(--bevel-raised);
      color: var(--ink); font-family: var(--font-mono); font-weight: 700;
      font-size: 10px; letter-spacing: 1px; padding: 6px 11px; border-radius: 7px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.16);
      transition: all 0.1s ease;
    }
    #minimize-btn:hover { background: var(--plastic-btn-hover); }
    #minimize-btn:active { transform: translateY(1px); box-shadow: inset 1px 2px 4px rgba(0,0,0,0.35); border-color: var(--bevel-inset); }

    /* Controls Grid */
    #controls-layout {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px;
      transition: opacity 0.3s ease;
    }

    /* Minimized State */
    #bottom-panel.minimized #controls-layout { display: none; }
    #bottom-panel.minimized { padding-bottom: 16px; }

    .control-column { display: flex; flex-direction: column; gap: 7px; }
    
    .col-title {
      color: var(--plate-text); font-family: var(--font-display);
      font-size: 13px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; text-align: center;
      background: var(--plate-dark);
      border: 1px solid; border-color: #5a5a5a #1a1a1a #0a0a0a #3a3a3a;
      border-radius: 4px; padding: 5px 8px; margin-bottom: 4px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), 0 1px 2px rgba(0,0,0,0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }

    /* The Brush title is split into three clickable tool tabs (Brush/Pen/Edit) */
    .tool-tabs { gap: 3px; padding: 3px; }
    .tool-tab {
      flex: 1; cursor: pointer; user-select: none;
      font-family: var(--font-display); font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--ink-muted); background: transparent; border: none; border-radius: 3px;
      padding: 4px 2px; transition: color .12s, background .12s, box-shadow .12s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .tool-tab:hover { color: var(--ink); }
    .tool-tab.active {
      color: var(--ink); background: var(--plastic-raised);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.4);
    }
    .tool-tab.active[data-tool="pen"] {
      color: var(--led-on); text-shadow: 0 0 6px var(--led-glow), 0 1px 2px rgba(0,0,0,0.6);
      box-shadow: inset 0 0 0 1px var(--led-on), 0 1px 2px rgba(0,0,0,0.4);
    }
    .tool-tab.active[data-tool="edit"] {
      color: var(--gold); text-shadow: 0 0 6px rgba(255,213,74,0.6), 0 1px 2px rgba(0,0,0,0.6);
      box-shadow: inset 0 0 0 1px var(--gold), 0 1px 2px rgba(0,0,0,0.4);
    }

    .control-group { display: flex; flex-direction: column; gap: 4px; }
    
    .label { 
      color: var(--ink); font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; 
      display: flex; justify-content: space-between; align-items: center;
      text-shadow: 0 1px 1px rgba(0,0,0,0.7);
    }
    
    /* Mini phosphor LCD readout */
    .val-display { 
      color: var(--lcd-text); font-size: 11px; letter-spacing: 1px; font-weight: 700;
      font-family: var(--font-mono);
      min-width: 34px; text-align: right; padding: 1px 6px; border-radius: 3px;
      background: var(--lcd-bg);
      border: 1px solid #05070a;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.35);
      text-shadow: 0 0 5px rgba(143,240,168,0.65);
    }

    /* Inputs Styling */
    input[type="color"] {
      -webkit-appearance: none; border: none; width: 100%; height: 24px;
      cursor: pointer; background: transparent; padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid; border-color: var(--bevel-inset); border-radius: 4px; }
    input[type="color"] { border: 2px solid; border-color: var(--bevel-inset); border-radius: 5px; height: 26px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.3); }

    /* Physical fader-groove sliders — matrix-green fill up to the thumb */
    input[type="range"] { 
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      width: 100%; height: 14px; margin: 4px 0 6px; padding: 0;
      border-radius: 7px; cursor: pointer; --fill: 0%;
      background:
        linear-gradient(to right, var(--slider-fill) 0 var(--fill), transparent var(--fill) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.25), transparent 45%),
        linear-gradient(180deg, #141416 0%, #1e1e22 50%, #161619 100%);
      border: 2px solid; border-color: var(--bevel-inset);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.7), inset 0 -1px 1px rgba(255,255,255,0.06), 0 1px 0 rgba(255,255,255,0.06);
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-moz-focus-outer { border: 0; }
    input[type="range"]::-webkit-slider-runnable-track { 
      width: 100%; height: 10px; background: transparent; border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      height: 24px; width: 16px; border-radius: 4px;
      background: linear-gradient(180deg, #7a7268 0%, #5a5448 50%, #4a4238 100%);
      -webkit-appearance: none; margin-top: -9px;
      border: 2px solid; border-color: #8a8278 #3a3630 #2a2620 #5a5448;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.2);
      transition: transform 0.08s;
    }
    input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.06); }
    /* Firefox */
    input[type="range"]::-moz-range-track {
      width: 100%; height: 10px; background: transparent; border: none;
    }
    input[type="range"]::-moz-range-thumb {
      height: 22px; width: 15px; border-radius: 4px;
      background: linear-gradient(180deg, #7a7268 0%, #5a5448 50%, #4a4238 100%);
      border: 2px solid; border-color: #8a8278 #3a3630 #2a2620 #5a5448;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.2);
    }
    
    .button-row { display: flex; gap: 10px; margin-top: 4px; }
    
    .action-btn {
      padding: 8px 10px; border-radius: 7px; cursor: pointer;
      font-family: var(--font-mono); font-weight: 700;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      transition: all 0.1s ease; display: flex; align-items: center; justify-content: center;
      border: 2px solid; border-color: var(--bevel-raised);
      background: var(--plastic-btn); color: var(--ink);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.16);
    }
    .action-btn:hover { background: var(--plastic-btn-hover); }
    .action-btn:active { transform: translateY(1px); box-shadow: inset 1px 2px 4px rgba(0,0,0,0.3); border-color: var(--bevel-inset); }
    
    #sync-btn { flex: 1; }
    #sync-btn.active {
      background: radial-gradient(circle at 40% 30%, #ffe37a, var(--gold));
      border-color: #b8860b #6a5000 #4a3800 #8a6800; color: #3a2c00;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 0 6px rgba(255,213,74,0.5);
    }
    
    /* Export recording state (Export lives in the top menu bar) */
    #export-btn.recording { color: #ff6b6b; animation: recPulse 1s infinite; }
    @keyframes recPulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* --- Persistent top menu bar (spans the full width) --- */
    #menu-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      display: flex; align-items: center; gap: 2px;
      padding: 4px 8px;
      background: var(--plastic-bay);
      border-bottom: 1px solid #05070a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    #clear-btn { margin-left: auto; display: flex; align-items: center; justify-content: center; padding: 2px 10px; }
    #clear-btn svg { display: block; width: 26px; height: 26px; }
    .menu { position: relative; }
    .menu { display: flex; align-items: center; }
    .menu-title {
      background: transparent; border: none; color: var(--ink);
      font-family: var(--font-mono); font-weight: 700; font-size: 14px;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 5px 12px; border-radius: 5px; cursor: pointer;
      transition: background 0.1s ease; line-height: 1;
    }
    .menu-title:hover, .menu.open .menu-title { background: var(--plastic-btn-hover); }
    #export-btn { color: #5fd07a; }
    .menu-dropdown {
      position: absolute; top: 100%; left: 0; margin-top: 3px; z-index: 31;
      min-width: 130px; display: flex; flex-direction: column; gap: 2px;
      padding: 4px; border-radius: 7px;
      background: var(--plastic-raised);
      border: 2px solid; border-color: var(--bevel-raised);
      box-shadow: 0 6px 16px rgba(0,0,0,0.55);
    }
    .menu-item {
      background: transparent; border: none; color: var(--ink);
      font-family: var(--font-mono); font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px; text-align: left;
      padding: 7px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
      transition: background 0.1s ease;
    }
    .menu-item:hover { background: var(--plastic-btn-hover); }

    /* Utility */
    .hidden { display: none !important; }

    /* Info Button + About Dialog */
    #about-overlay {
      position: absolute; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
    }
    #about-dialog {
      background: var(--plastic-raised);
      border: 3px solid; border-color: var(--bevel-raised);
      border-radius: 12px; padding: 30px 44px; text-align: center;
      color: var(--ink); font-family: var(--font-mono);
      box-shadow: 4px 6px 16px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.12);
    }
    #about-dialog .about-title {
      color: var(--plate-text); font-family: var(--font-display);
      font-size: 22px; font-weight: 700; letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    #about-dialog .about-sub {
      color: var(--ink-muted); font-family: var(--font-mono);
      font-size: 13px; margin-top: 10px; letter-spacing: 0.5px;
    }
    #about-close {
      margin-top: 22px; padding: 8px 22px; border-radius: 7px; cursor: pointer;
      font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      border: 2px solid; border-color: var(--bevel-raised);
      background: var(--plastic-btn); color: var(--ink);
      box-shadow: 1px 2px 3px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.16);
      transition: all 0.1s ease;
    }
    #about-close:hover { background: var(--plastic-btn-hover); }
    #about-close:active { transform: translateY(1px); box-shadow: inset 1px 2px 3px rgba(0,0,0,0.3); border-color: var(--bevel-inset); }

    /* Curve Editor icon button (replaces the old checkbox) */
    .icon-btn {
      background: var(--plastic-btn);
      border: 2px solid; border-color: var(--bevel-raised);
      color: var(--ink); border-radius: 6px;
      width: 30px; height: 22px; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.16);
      transition: all 0.1s ease;
    }
    .icon-btn:hover { background: var(--plastic-btn-hover); }
    .icon-btn:active { transform: translateY(1px); box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3); }
    .icon-btn.active {
      background: radial-gradient(circle at 40% 30%, #ffe37a, var(--gold));
      border-color: #b8860b #6a5000 #4a3800 #8a6800; color: #3a2c00;
    }
    .icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

    .label-controls { display: flex; align-items: center; gap: 8px; }
    .toggle-btn {
      background: var(--plastic-btn);
      border: 2px solid; border-color: var(--bevel-raised);
      color: var(--ink); border-radius: 6px; height: 22px; padding: 0 8px;
      font-family: var(--font-mono); font-weight: 700; font-size: 9px; letter-spacing: 1px; cursor: pointer;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.16);
      transition: all 0.1s ease;
    }
    .toggle-btn:hover { background: var(--plastic-btn-hover); }
    .toggle-btn.active {
      background: radial-gradient(circle at 40% 30%, #ffe37a, var(--gold));
      border-color: #b8860b #6a5000 #4a3800 #8a6800; color: #3a2c00;
    }

    /* Floating Curve Editor Panel */
    #curve-panel {
      position: fixed; top: 64px; left: 24px; z-index: 30;
      width: 264px;
      background: var(--plastic-bay);
      border: 3px solid; border-color: var(--bevel-inset);
      border-radius: 14px; color: var(--ink);
      box-shadow: 4px 6px 16px rgba(0,0,0,0.45), inset 0 1px 2px rgba(255,255,255,0.4);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #curve-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 8px 8px 12px; cursor: move;
      background: var(--plate-dark);
      border-bottom: 2px solid #1a1a1a;
      touch-action: none;
    }
    .curve-panel-title {
      color: var(--plate-text); font-family: var(--font-display);
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .curve-panel-actions { display: flex; gap: 6px; }
    .curve-panel-actions button {
      background: var(--plastic-btn); border: 2px solid; border-color: var(--bevel-raised);
      color: var(--ink); width: 22px; height: 22px; border-radius: 5px;
      cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.16);
    }
    .curve-panel-actions button:hover { background: var(--plastic-btn-hover); }

  <script>
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });

    let dpr = window.devicePixelRatio || 1;
    function resize() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);

      // Pen overlay matches the canvas (backing store in device px, drawn in CSS px)
      const pen = document.getElementById('pen-overlay');
      pen.width = window.innerWidth * dpr;
      pen.height = window.innerHeight * dpr;
      const pctx = pen.getContext('2d');
      pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      try { if (typeof drawPenOverlay === 'function') drawPenOverlay(); } catch (_) {}

      // Responsive Grid Setup (Method 1 Fix)
      const grid = document.getElementById('grid-bg');
      const cols = Math.round(window.innerWidth / 40);
      const exactSize = window.innerWidth / cols;
      grid.style.backgroundSize = `${exactSize}px ${exactSize}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    // --- Shaders ---
    const vsSource = `
      attribute vec2 a_position;
      attribute vec3 a_color;
      attribute float a_size;
      attribute float a_pBlur;   // per-point brush blur baked at draw time
      attribute float a_pSoft;   // per-point brush softness baked at draw time
      attribute float a_pAlpha;  // per-point brush opacity baked at draw time
      uniform vec2 u_resolution;
      uniform float u_blurSpread; // trail (echo) blur
      uniform float u_sizeOffset; // trail (echo) scale
      varying vec3 v_color;
      varying float v_blur;
      varying float v_soft;
      varying float v_pAlpha;

      void main() {
        vec2 zeroToOne = a_position / u_resolution;
        vec2 zeroToTwo = zeroToOne * 2.0;
        vec2 clipSpace = zeroToTwo - 1.0;
        gl_Position = vec4(clipSpace * vec2(1.0, -1.0), 0.0, 1.0);
        v_color = a_color;

        float totalBlur = u_blurSpread + a_pBlur;
        v_blur = totalBlur;
        v_soft = a_pSoft;
        v_pAlpha = a_pAlpha;

        float finalSize = a_size * (1.0 + totalBlur * 1.5) * (1.0 + u_sizeOffset);
        gl_PointSize = max(0.5, finalSize); 
      }
    `;

    const fsSource = `
      precision mediump float;
      varying vec3 v_color;
      varying float v_blur;
      varying float v_soft;
      varying float v_pAlpha;
      uniform float u_alphaMultiplier;
      uniform float u_baseOpacity;

      void main() {
        float d = distance(gl_PointCoord, vec2(0.5)) * 2.0;
        if (d > 1.0) discard;
        float hardAlpha = smoothstep(1.0, 0.85, d);
        float softAlpha = exp(-d * d * 4.0) * (1.0 - smoothstep(0.8, 1.0, d));
        float blurFactor = clamp(v_blur / 3.0, 0.0, 1.0);
        blurFactor = clamp(blurFactor + v_soft, 0.0, 1.0);
        float alpha = mix(hardAlpha, softAlpha, blurFactor);
        float energy = 1.0 / (1.0 + v_blur * 0.8);
        float finalAlpha = alpha * u_alphaMultiplier * energy * u_baseOpacity * v_pAlpha;
        
        gl_FragColor = vec4(v_color * finalAlpha, finalAlpha);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(shader));
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const a_pos = gl.getAttribLocation(program, "a_position");
    const a_col = gl.getAttribLocation(program, "a_color");
    const a_size = gl.getAttribLocation(program, "a_size");
    const a_pBlur = gl.getAttribLocation(program, "a_pBlur");
    const a_pSoft = gl.getAttribLocation(program, "a_pSoft");
    const a_pAlpha = gl.getAttribLocation(program, "a_pAlpha");
    const u_res = gl.getUniformLocation(program, "u_resolution");
    const u_blur = gl.getUniformLocation(program, "u_blurSpread");
    const u_alpha = gl.getUniformLocation(program, "u_alphaMultiplier");
    const u_baseOp = gl.getUniformLocation(program, "u_baseOpacity");
    const u_size = gl.getUniformLocation(program, "u_sizeOffset");

    const ghostBuffer = gl.createBuffer();

    // --- Engine State ---
    const MAX_FRAMES = 180;
    const floatsPerPoint = 9; // x,y, r,g,b, size, pBlur, pSoft, pAlpha
    
    let frameData = Array.from({ length: MAX_FRAMES }, () => []);
    // Free-hand strokes, kept separate from pen paths so committed paths stay
    // editable. frameData = freeData + (every baked pen path). See rebakePen().
    let freeData = Array.from({ length: MAX_FRAMES }, () => []);
    let penPaths = []; // committed, re-editable paths: {anchors,closed,smoothness,color,size,soft}
    let frameNeedsUpdate = Array(MAX_FRAMES).fill(false);
    let frameBuffers = Array.from({ length: MAX_FRAMES }, () => gl.createBuffer());

    let isPlaying = false; 
    let editMode = false; // per-frame editing: paused on a selected frame, draw builds that frame
    let playheadPos = 0.0;
    let currentFrame = 0;

    let firstParticle = null; 
    let firstParticleFrame = null; 
    let hasCompletedFirstCycle = false;

    let strokeRecordingActive = false; 
    let isSyncActive = false;
    
    // UI Elements
    const colorPicker = document.getElementById('color-picker');
    const sizeSlider = document.getElementById('size-slider');
    const opacitySlider = document.getElementById('opacity-slider');
    const framesSlider = document.getElementById('frames-slider');
    const speedSlider = document.getElementById('speed-slider');
    const trailSlider = document.getElementById('trail-slider');
    const blurSlider = document.getElementById('blur-slider');
    const softSlider = document.getElementById('soft-slider');
    
    const valFrames = document.getElementById('val-frames');
    const valSpeed = document.getElementById('val-speed');
    const valTrail = document.getElementById('val-trail');
    
    const bottomPanel = document.getElementById('bottom-panel');
    const timelineContainer = document.getElementById('timeline-container');
    const minimizeBtn = document.getElementById('minimize-btn');
    const playBtn = document.getElementById('play-btn');
    const syncBtn = document.getElementById('sync-btn');
    const exportBtn = document.getElementById('export-btn');
    let frameSteps = [];

    // --- Minimize Logic ---
    minimizeBtn.addEventListener('click', () => {
      bottomPanel.classList.toggle('minimized');
      minimizeBtn.innerText = bottomPanel.classList.contains('minimized') ? 'SHOW' : 'HIDE';
    });

    // --- Play / Pause Logic ---
    const PLAY_ICON = '<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg>';
    const PAUSE_ICON = '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
    let lastPlayState = null;
    function updatePlayBtn() {
      if (isPlaying === lastPlayState) return;
      playBtn.innerHTML = isPlaying ? PAUSE_ICON : PLAY_ICON;
      bottomPanel.classList.toggle('playing', isPlaying);
      lastPlayState = isPlaying;
    }
    updatePlayBtn();

    playBtn.addEventListener('click', () => {
      // Pressing play always leaves per-frame edit mode and resumes the loop.

        editMode = false;
        isPlaying = true;
      } else {
        isPlaying = !isPlaying;
      }

      updatePlayBtn();
