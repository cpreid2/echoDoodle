    function updateEditModeUI() {
      bottomPanel.classList.toggle('editing', editMode);
    }

    // --- About Dialog Logic ---
    const infoBtn = document.getElementById('info-btn');
    const aboutOverlay = document.getElementById('about-overlay');
    const aboutClose = document.getElementById('about-close');
    infoBtn.addEventListener('click', () => aboutOverlay.classList.remove('hidden'));
    aboutClose.addEventListener('click', () => aboutOverlay.classList.add('hidden'));
    aboutOverlay.addEventListener('click', (e) => {
      if (e.target === aboutOverlay) aboutOverlay.classList.add('hidden');
    });

    // --- Curve Editor (parameter scaling over the loop) ---
    const curveToggleBtn = document.getElementById('curve-toggle-btn');
    const curveOnOff = document.getElementById('curve-onoff');
    const curveParamSelect = document.getElementById('curve-param');
    const curveCanvas = document.getElementById('curve-canvas');
    const curvePanel = document.getElementById('curve-panel');
    const curvePanelHeader = document.getElementById('curve-panel-header');
    const curveCloseBtn = document.getElementById('curve-close-btn');
    const curveCtx = curveCanvas.getContext('2d');

    const curvePresetSelect = document.getElementById('curve-preset');

    let curveEnabled = false;
    let curveParam = 'size';

    // Common animation "waves" as editable keyframe sets (x = loop position 0..1, y = value 0..1)
    const CURVE_PRESETS = {
      rampUp:    [ {x:0,y:0}, {x:1,y:1} ],
      rampDown:  [ {x:0,y:1}, {x:1,y:0} ],
      easeIn:    [ {x:0,y:0}, {x:0.45,y:0.1}, {x:0.75,y:0.32}, {x:1,y:1} ],
      easeOut:   [ {x:0,y:0}, {x:0.25,y:0.68}, {x:0.55,y:0.9}, {x:1,y:1} ],
      easeInOut: [ {x:0,y:0}, {x:0.25,y:0.08}, {x:0.5,y:0.5}, {x:0.75,y:0.92}, {x:1,y:1} ],
      sine:      [ {x:0,y:0}, {x:0.25,y:0.71}, {x:0.5,y:1}, {x:0.75,y:0.71}, {x:1,y:0} ],
      triangle:  [ {x:0,y:0}, {x:0.5,y:1}, {x:1,y:0} ],
      pulse:     [ {x:0,y:0}, {x:0.15,y:1}, {x:0.85,y:1}, {x:1,y:0} ],
      valley:    [ {x:0,y:1}, {x:0.25,y:0.29}, {x:0.5,y:0}, {x:0.75,y:0.29}, {x:1,y:1} ],
      constant:  [ {x:0,y:1}, {x:1,y:1} ]
    };

    function clonePreset(name) {
      return (CURVE_PRESETS[name] || CURVE_PRESETS.rampUp).map(p => ({ x: p.x, y: p.y }));
    }

    // Editable keyframes, kept sorted by x with locked endpoints at x=0 and x=1.
    let curvePoints = clonePreset('sine');
    curvePresetSelect.value = 'sine';

    const CURVE_PAD = 12;
    const HIT_RADIUS = 16;   // px hit test for grabbing / removing a point
    const MIN_X_GAP = 0.02;  // minimum spacing between neighbouring keyframes
    let curveLUT = new Array(101).fill(0.5);

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }

    // Catmull-Rom interpolation through the keyframes (linear when only two points).
    function sampleCurveAt(x) {
      const pts = curvePoints;
      const n = pts.length;
      x = clamp01(x);
      if (n === 0) return 0.5;
      if (x <= pts[0].x) return clamp01(pts[0].y);
      if (x >= pts[n-1].x) return clamp01(pts[n-1].y);
      let i = 0;
      while (i < n - 1 && x > pts[i+1].x) i++;
      const p1 = pts[i], p2 = pts[i+1];
      const span = (p2.x - p1.x) || 1e-6;
      const t = (x - p1.x) / span;
      if (n === 2) return clamp01(p1.y + (p2.y - p1.y) * t);
      const p0 = pts[i-1] || p1;
      const p3 = pts[i+2] || p2;
      const t2 = t*t, t3 = t2*t;
      const y = 0.5 * ( (2*p1.y)
              + (-p0.y + p2.y) * t
              + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2
              + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * t3 );
      return clamp01(y);
    }

    function buildCurveLUT() {
      const N = curveLUT.length;
      const arr = new Array(N);
      for (let i = 0; i < N; i++) arr[i] = sampleCurveAt(i / (N - 1));
      curveLUT = arr;
    }

    function sampleLUT(lut, x) {
      const N = lut.length;
      return lut[Math.round(clamp01(x) * (N - 1))];
    }
    function sampleCurve(x) { return sampleLUT(curveLUT, x); }

    // A frozen copy of the current curve so a baked path keeps its own scaling
    // even if the global curve is later changed.
    function currentCurveSnapshot() {
      return { enabled: curveEnabled, param: curveParam, lut: curveLUT.slice() };
    }

    function curveToScreen(p) {
      const W = curveCanvas.width, H = curveCanvas.height;
      return {
        x: CURVE_PAD + p.x * (W - 2 * CURVE_PAD),
        y: (H - CURVE_PAD) - p.y * (H - 2 * CURVE_PAD)
      };
    }

    function drawCurveEditor() {
      const W = curveCanvas.width, H = curveCanvas.height;
      const ctx = curveCtx;
      ctx.clearRect(0, 0, W, H);

      // grid
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const gx = CURVE_PAD + (i / 4) * (W - 2 * CURVE_PAD);
        const gy = CURVE_PAD + (i / 4) * (H - 2 * CURVE_PAD);
        ctx.beginPath(); ctx.moveTo(gx, CURVE_PAD); ctx.lineTo(gx, H - CURVE_PAD); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(CURVE_PAD, gy); ctx.lineTo(W - CURVE_PAD, gy); ctx.stroke();
      }

      const accent = colorPicker.value;

      // smooth curve sampled across the loop
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const STEPS = 120;
      for (let i = 0; i <= STEPS; i++) {
        const x = i / STEPS;
        const s = curveToScreen({ x, y: sampleCurveAt(x) });
        if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
      }
      ctx.stroke();

      // playhead marker on curve
      if (curveEnabled) {
        const af = parseInt(framesSlider.value, 10);
        const lx = af > 0 ? clamp01(playheadPos / af) : 0;
        const ps = curveToScreen({ x: lx, y: sampleCurve(lx) });
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(ps.x, ps.y, 3, 0, Math.PI * 2); ctx.fill();
      }

      // keyframe points (endpoints are drawn hollow to signal they're x-locked)
      for (let i = 0; i < curvePoints.length; i++) {
        const s = curveToScreen(curvePoints[i]);
        const active = (i === curveDragIndex);
        const endpoint = (i === 0 || i === curvePoints.length - 1);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.arc(s.x, s.y, active ? 15 : 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = endpoint ? '#101012' : accent;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    }

    // --- Curve editor interaction ---
    let curveDragIndex = -1;

    function sortCurvePoints() { curvePoints.sort((a, b) => a.x - b.x); }
    function markCustom() { curvePresetSelect.value = 'custom'; }
    function refreshCurve() { buildCurveLUT(); drawCurveEditor(); }

    function curvePointerPos(e) {
      const rect = curveCanvas.getBoundingClientRect();
      const scaleX = curveCanvas.width / rect.width;
      const scaleY = curveCanvas.height / rect.height;
      const sx = (e.clientX - rect.left) * scaleX;
      const sy = (e.clientY - rect.top) * scaleY;
      const W = curveCanvas.width, H = curveCanvas.height;
      return {
        sx, sy,
        nx: clamp01((sx - CURVE_PAD) / (W - 2 * CURVE_PAD)),
        ny: clamp01(((H - CURVE_PAD) - sy) / (H - 2 * CURVE_PAD))
      };
    }

    function nearestPoint(p) {
      let best = -1, bestDist = Infinity;
      for (let i = 0; i < curvePoints.length; i++) {
        const s = curveToScreen(curvePoints[i]);
        const d = Math.hypot(s.x - p.sx, s.y - p.sy);
        if (d < bestDist) { bestDist = d; best = i; }
      }
      return { index: best, dist: bestDist };
    }

    function applyDrag(p) {
      const i = curveDragIndex;
      if (i < 0) return;
      const pt = curvePoints[i];
      pt.y = p.ny;
      // Endpoints keep their x locked; inner points move in x, clamped between neighbours.
      if (i > 0 && i < curvePoints.length - 1) {
        const lo = curvePoints[i-1].x + MIN_X_GAP;
        const hi = curvePoints[i+1].x - MIN_X_GAP;
        pt.x = Math.max(lo, Math.min(hi, p.nx));
      }
      refreshCurve();
    }

    curveCanvas.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.button === 2) return; // right-click is handled by contextmenu (remove)
      const p = curvePointerPos(e);
      const hit = nearestPoint(p);
      if (hit.index >= 0 && hit.dist <= HIT_RADIUS) {
        curveDragIndex = hit.index;
        curveCanvas.setPointerCapture(e.pointerId);
        markCustom();
        applyDrag(p);
      }
    });

    curveCanvas.addEventListener('pointermove', (e) => {
      if (curveDragIndex < 0) return;
      applyDrag(curvePointerPos(e));
    });

    function endCurveDrag(e) {
      if (curveDragIndex >= 0) {
        curveDragIndex = -1;
        try { curveCanvas.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    }
    curveCanvas.addEventListener('pointerup', endCurveDrag);
    curveCanvas.addEventListener('pointercancel', endCurveDrag);

    // Double-click empty space to add a keyframe.
    curveCanvas.addEventListener('dblclick', (e) => {
      e.preventDefault();
      const p = curvePointerPos(e);
      const hit = nearestPoint(p);
      if (hit.index >= 0 && hit.dist <= HIT_RADIUS) return; // don't stack on an existing point
      curvePoints.push({ x: clamp01(p.nx), y: clamp01(p.ny) });
      sortCurvePoints();
      markCustom();
      refreshCurve();
    });

    // Right-click a point to remove it (endpoints can't be removed).
    curveCanvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const p = curvePointerPos(e);
      const hit = nearestPoint(p);
      if (hit.index > 0 && hit.index < curvePoints.length - 1 && hit.dist <= HIT_RADIUS) {
        curvePoints.splice(hit.index, 1);
        markCustom();
        refreshCurve();
      }
    });

    // Wave preset selector loads a fresh set of keyframes.
    function applyPreset(name) {
      curvePoints = clonePreset(name);
      sortCurvePoints();
      refreshCurve();
    }
    curvePresetSelect.addEventListener('change', () => {
      if (curvePresetSelect.value !== 'custom') applyPreset(curvePresetSelect.value);
    });

    // ON/OFF toggle controls whether the effect is applied.
    function setCurveEnabled(on) {
      curveEnabled = on;
      curveOnOff.classList.toggle('active', on);
      curveOnOff.textContent = on ? 'ON' : 'OFF';
      curveOnOff.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    curveOnOff.addEventListener('click', () => setCurveEnabled(!curveEnabled));

    // The icon button opens/closes the floating editor (independent of ON/OFF).
    let curveAutoEnabledOnce = false;
    function openCurvePanel() {
      curvePanel.classList.remove('hidden');
      curveToggleBtn.classList.add('active');
      // Convenience: the very first time the editor is opened, switch scaling ON.
      if (!curveAutoEnabledOnce) {
        curveAutoEnabledOnce = true;
        setCurveEnabled(true);
      }
      refreshCurve();
    }
    function closeCurvePanel() {
      curvePanel.classList.add('hidden');
      curveToggleBtn.classList.remove('active');
    }
    curveToggleBtn.addEventListener('click', () => {
      if (curvePanel.classList.contains('hidden')) openCurvePanel();
      else closeCurvePanel();
    });
    curveCloseBtn.addEventListener('click', closeCurvePanel);
    curveParamSelect.addEventListener('change', () => { curveParam = curveParamSelect.value; });

    // Make the floating panel draggable by its header.
    (function () {
      let dragging = false, sx = 0, sy = 0, startLeft = 0, startTop = 0;
      curvePanelHeader.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return; // let the min/close buttons work
        dragging = true;
        const rect = curvePanel.getBoundingClientRect();
        startLeft = rect.left; startTop = rect.top;
        sx = e.clientX; sy = e.clientY;
        curvePanel.style.left = startLeft + 'px';
        curvePanel.style.top = startTop + 'px';
        curvePanel.style.right = 'auto';
        curvePanelHeader.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      curvePanelHeader.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        let nl = startLeft + (e.clientX - sx);
        let nt = startTop + (e.clientY - sy);
        nl = Math.max(0, Math.min(window.innerWidth - 60, nl));
        nt = Math.max(0, Math.min(window.innerHeight - 40, nt));
        curvePanel.style.left = nl + 'px';
        curvePanel.style.top = nt + 'px';
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        try { curvePanelHeader.releasePointerCapture(e.pointerId); } catch (_) {}
      }
      curvePanelHeader.addEventListener('pointerup', endDrag);
      curvePanelHeader.addEventListener('pointercancel', endDrag);
    })();

    buildCurveLUT();

    // --- Sync Toggle Logic ---
    syncBtn.addEventListener('click', () => {
      isSyncActive = !isSyncActive;
      syncBtn.classList.toggle('active', isSyncActive);
    });

    // --- Export Video Logic ---
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let recordingTickCount = 0;
    let requiredTicks = 0;

    exportBtn.addEventListener('click', () => {
      if (isRecording) return; 
      
      const activeFrames = parseInt(framesSlider.value, 10);
      const speed = parseFloat(speedSlider.value);
      requiredTicks = Math.ceil(activeFrames / speed);
      recordingTickCount = 0;
      
      playheadPos = 0;
      currentFrame = 0;
      isPlaying = true;
      editMode = false;
      updateEditModeUI();
      
      const stream = canvas.captureStream(60); 
      const mimeTypes = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
      const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
      
      mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });
      recordedChunks = [];
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mimeType || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `echodoodle-loop.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
        URL.revokeObjectURL(url);
        
        exportBtn.innerText = 'Export';
        exportBtn.classList.remove('recording');
        isRecording = false;
      };
      
      exportBtn.innerText = 'Rec...';
      exportBtn.classList.add('recording');
      isRecording = true;
      mediaRecorder.start();
    });

    // --- Save / Load ---
    const rawBtn = document.getElementById('raw-btn');
    const importBtn = document.getElementById('import-btn');
    const importFile = document.getElementById('import-file');

    function roundTo(n, p) { const f = Math.pow(10, p); return Math.round(n * f) / f; }

    function serializeProject() {
      const frames = parseInt(framesSlider.value, 10);
      const fd = [];
      for (let i = 0; i < frames; i++) {
        const src = frameData[i] || [];
        const out = new Array(src.length);
        for (let j = 0; j < src.length; j += floatsPerPoint) {
          out[j]     = roundTo(src[j], 1);      // x
          out[j + 1] = roundTo(src[j + 1], 1);  // y
          out[j + 2] = roundTo(src[j + 2], 4);  // r
          out[j + 3] = roundTo(src[j + 3], 4);  // g
          out[j + 4] = roundTo(src[j + 4], 4);  // b
          out[j + 5] = roundTo(src[j + 5], 2);  // size
          out[j + 6] = roundTo(src[j + 6], 3);  // pBlur
          out[j + 7] = roundTo(src[j + 7], 3);  // pSoft
          out[j + 8] = roundTo(src[j + 8], 3);  // pAlpha
        }
        fd.push(out);
      }
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0a0a0c';
      return {
        app: 'echoDoodle', version: 1,
        refW: canvas.width, refH: canvas.height,
        floatsPerPoint: floatsPerPoint,
        frameCount: frames,
        speed: parseFloat(speedSlider.value),
        trail: parseInt(trailSlider.value, 10),
        opacity: parseFloat(opacitySlider.value),
        blur: parseFloat(blurSlider.value),
        size: parseFloat(sizeSlider.value),
        softness: parseFloat(softSlider.value),
        color: colorPicker.value,
        background: bg,
        frameData: fd
      };
    }

    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    rawBtn.addEventListener('click', () => {
      const json = JSON.stringify(serializeProject());
      downloadBlob('echodoodle.json', new Blob([json], { type: 'application/json' }));
    });

    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyProject(JSON.parse(reader.result)); }
        catch (err) { alert('Could not read that file: ' + err.message); }
        importFile.value = '';
      };
      reader.readAsText(file);
    });

    // --- Top menu bar: File dropdown open/close ---
    (function () {
      const fileMenu = document.getElementById('file-menu');
      const fileBtn = document.getElementById('file-menu-btn');
      const fileDropdown = fileMenu.querySelector('.menu-dropdown');
      function closeFile() {
        fileMenu.classList.remove('open');
        fileDropdown.classList.add('hidden');
        fileBtn.setAttribute('aria-expanded', 'false');
      }
      fileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = fileMenu.classList.toggle('open');
        fileDropdown.classList.toggle('hidden', !open);
        fileBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      // Choosing an item (or clicking anywhere else / Export) closes the menu.
      fileDropdown.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', closeFile));
      document.addEventListener('click', (e) => { if (!fileMenu.contains(e.target)) closeFile(); });
      exportBtn.addEventListener('click', closeFile);
    })();

    function setSliderValue(el, v) {
      v = Number(v);
      if (!Number.isFinite(v)) return;
      const min = parseFloat(el.min), max = parseFloat(el.max);
      el.value = Math.max(min, Math.min(max, v));
    }

    // Coerce any imported value to a finite number (defends against NaN / strings
    // reaching WebGL, which would corrupt geometry).
    function num(v, fallback) {
      v = Number(v);
      return Number.isFinite(v) ? v : (fallback || 0);
    }
    function clampCh(v) { return Math.max(0, Math.min(1, num(v, 0))); }
    // Only accept strict hex colors; ignore anything else.
    function sanitizeColor(c) {
      return (typeof c === 'string' && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c.trim()))
        ? c.trim() : null;
    }

    // Guard against absurdly large files crashing the tab.
    const MAX_TOTAL_FLOATS = 6000000;

    function applyProject(p) {
      if (!p || p.app !== 'echoDoodle' || !Array.isArray(p.frameData)) {
        alert('That does not look like an echoDoodle file.');
        return;
      }
      const frames = Math.max(10, Math.min(MAX_FRAMES, p.frameCount | 0));

      setSliderValue(framesSlider, frames);
      valFrames.innerText = frames;
      trailSlider.max = frames;
      setSliderValue(speedSlider, p.speed);
      setSliderValue(trailSlider, p.trail);
      setSliderValue(opacitySlider, p.opacity);
      setSliderValue(blurSlider, p.blur);
      setSliderValue(sizeSlider, p.size);
      setSliderValue(softSlider, p.softness);
      const safeColor = sanitizeColor(p.color);
      if (safeColor) {
        colorPicker.value = safeColor;
        brushRgb = hexToRgb(colorPicker.value);
        bottomPanel.style.setProperty('--playhead-color', colorPicker.value);
      }

      valSpeed.innerText = parseFloat(speedSlider.value).toFixed(1) + 'x';
      valTrail.innerText = trailSlider.value;
      buildTimeline(frames);
      document.querySelectorAll('input[type="range"]').forEach(updateRangeFill);

      // Contain-fit the stored geometry into the current canvas.
      const refW = num(p.refW, 0) > 0 ? num(p.refW) : canvas.width;
      const refH = num(p.refH, 0) > 0 ? num(p.refH) : canvas.height;
      const S = Math.min(canvas.width / refW, canvas.height / refH);
      const ox = (canvas.width - refW * S) / 2;
      const oy = (canvas.height - refH * S) / 2;
      const fpp = Math.max(6, (p.floatsPerPoint | 0) || 9);

      let totalFloats = 0;
      let truncated = false;
      for (let i = 0; i < MAX_FRAMES; i++) { frameData[i] = []; frameNeedsUpdate[i] = true; }
      for (let i = 0; i < p.frameData.length && i < MAX_FRAMES && !truncated; i++) {
        const src = Array.isArray(p.frameData[i]) ? p.frameData[i] : [];
        const dst = [];
        for (let j = 0; j + fpp <= src.length; j += fpp) {
          if (totalFloats + 9 > MAX_TOTAL_FLOATS) { truncated = true; break; }
          dst.push(
            ox + num(src[j]) * S, oy + num(src[j + 1]) * S,
            clampCh(src[j + 2]), clampCh(src[j + 3]), clampCh(src[j + 4]),
            Math.max(0, num(src[j + 5])) * S,
            Math.max(0, num(src[j + 6])), Math.max(0, num(src[j + 7])),
            num(src[j + 8], 1)
          );
          totalFloats += 9;
        }
        frameData[i] = dst;
        frameNeedsUpdate[i] = true;
      }
      // Loaded artwork becomes the free-draw layer; pen paths start fresh.
      for (let i = 0; i < MAX_FRAMES; i++) freeData[i] = frameData[i].slice();
      penPaths = [];
      if (typeof clearPen === 'function') clearPen();
      if (truncated) alert('This file was unusually large, so some drawing data was skipped.');

      firstParticle = null;
      firstParticleFrame = null;
      hasCompletedFirstCycle = true;
      editMode = false;
      isPlaying = true;
      playheadPos = 0;
      currentFrame = 0;
      updateEditModeUI();
      updatePlayBtn();
    }

    // --- Quantized Timeline Setup ---
    function buildTimeline(totalFrames) {
      timelineContainer.innerHTML = '';
      frameSteps = [];
      for (let i = 0; i < totalFrames; i++) {
        const step = document.createElement('div');
        step.className = 'frame-step';
        const frameIndex = i;
        step.addEventListener('click', () => {
          // Enter per-frame edit mode: park the playhead on this frame so the
          // user can draw directly onto it and build the animation frame by frame.
          editMode = true;
          isPlaying = false;
          playheadPos = frameIndex;
          currentFrame = frameIndex;
          updateEditModeUI();
          updatePlayBtn();
        });
        timelineContainer.appendChild(step);
        frameSteps.push(step);
      }
    }
    
    buildTimeline(parseInt(framesSlider.value, 10));

    // Prevent drawing when interacting with UI Panel
    bottomPanel.addEventListener('pointerdown', e => e.stopPropagation());

    framesSlider.addEventListener('input', (e) => {
      let f = parseInt(e.target.value, 10);
      valFrames.innerText = f;
      
      trailSlider.max = f;
      let currentTrail = parseInt(trailSlider.value, 10);
      if (currentTrail > f) {
        trailSlider.value = f;
        valTrail.innerText = f;
      }
      updateRangeFill(trailSlider);
      buildTimeline(f);
    });
    
    speedSlider.addEventListener('input', (e) => valSpeed.innerText = parseFloat(e.target.value).toFixed(1) + 'x');
    trailSlider.addEventListener('input', (e) => valTrail.innerText = e.target.value);

    // --- Slider fill (shows filled portion of the track) ---
    function updateRangeFill(el) {
      const min = parseFloat(el.min) || 0;
      const max = parseFloat(el.max) || 100;
      const val = parseFloat(el.value);
      const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
      el.style.setProperty('--fill', pct + '%');
    }
    const allSliders = document.querySelectorAll('input[type="range"]');
    allSliders.forEach((el) => {
      updateRangeFill(el);
      el.addEventListener('input', () => updateRangeFill(el));
    });

    // Sync the value labels to the sliders' actual default values on load.
    function syncValueLabels() {
      valFrames.innerText = parseInt(framesSlider.value, 10);
      valSpeed.innerText = parseFloat(speedSlider.value).toFixed(1) + 'x';
      valTrail.innerText = trailSlider.value;
    }
    syncValueLabels();

    let isDrawing = false;
    let activePointerId = null;
    
    // Stroke Interpolation Tracking
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    let lastSpatialX = 0, lastSpatialY = 0;
    
    function hexToRgb(hex) {
      let bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16 & 255) / 255, (bigint >> 8 & 255) / 255, (bigint & 255) / 255];
    }
    let brushRgb = hexToRgb(colorPicker.value);
    bottomPanel.style.setProperty('--playhead-color', colorPicker.value);
    
    colorPicker.addEventListener('input', (e) => {
      brushRgb = hexToRgb(e.target.value);
      bottomPanel.style.setProperty('--playhead-color', e.target.value);
    });
    
    document.getElementById('clear-btn').addEventListener('click', () => {
      for(let i=0; i<MAX_FRAMES; i++) {
        frameData[i] = [];
        freeData[i] = [];
        frameNeedsUpdate[i] = true;
      }
      penPaths = [];
      if (typeof clearPen === 'function') clearPen();
      firstParticle = null;
      firstParticleFrame = null;
      hasCompletedFirstCycle = false;
      isPlaying = false;
      playheadPos = 0;
      currentFrame = 0;
    });

    // Curve Scaling is a BRUSH effect: the modulation is evaluated at draw time
    // (based on the frame the point lands on) and baked into the stored point.
    // Editing the curve afterwards never changes what's already on the canvas.
    // Modulation sampled at a continuous loop position x (0..1).
    function computeModAtX(x, enabled, param, lut) {
      let sizeMul = 1.0, noiseAmt = 0.0, blurAdd = 0.0, softAdd = 0.0, alphaMul = 1.0;
      if (enabled && lut) {
        const cv = sampleLUT(lut, x);
        switch (param) {
          case 'size':     sizeMul = 0.15 + cv * 1.85; break;
          case 'opacity':  alphaMul = 0.1 + cv * 0.9;  break;
          case 'blur':     blurAdd = cv * 6.0;         break;
          case 'noise':    noiseAmt = cv * 35.0 * dpr; break;
          case 'softness': softAdd = cv;               break;
        }
      }
      return { sizeMul, noiseAmt, blurAdd, softAdd, alphaMul };
    }

    function computeMod(frameIndex, enabled, param, lut) {
      const af = parseInt(framesSlider.value, 10);
      return computeModAtX(af > 0 ? (frameIndex / af) : 0, enabled, param, lut);
    }

    function brushModForFrame(frameIndex) {
      return computeMod(frameIndex, curveEnabled, curveParam, curveLUT);
    }

    function makeBakedPoint(x, y, frameIndex) {
      const baseSize = parseFloat(sizeSlider.value) * dpr;
      const baseSoft = parseFloat(softSlider.value); // brush softness baked per point
      const m = brushModForFrame(frameIndex);
      let px = x, py = y;
      if (m.noiseAmt > 0) {
        px += (Math.random() - 0.5) * m.noiseAmt;
        py += (Math.random() - 0.5) * m.noiseAmt;
      }
      return [px, py, brushRgb[0], brushRgb[1], brushRgb[2], baseSize * m.sizeMul, m.blurAdd, baseSoft + m.softAdd, m.alphaMul];
    }

    // Free-hand point: written to BOTH the live buffer and the free-draw store
    // (so re-baking pen paths never wipes hand-drawn strokes).
    function addFreePoint(frameIndex, x, y) {
      const p = makeBakedPoint(x, y, frameIndex);
      for (let i = 0; i < p.length; i++) { frameData[frameIndex].push(p[i]); freeData[frameIndex].push(p[i]); }
      frameNeedsUpdate[frameIndex] = true;
    }

    function addPoint(x, y) {
      if (!firstParticle) {
        const size = parseFloat(sizeSlider.value) * dpr;
        firstParticle = [x, y, brushRgb[0], brushRgb[1], brushRgb[2], size, 0.0, 0.0, 1.0];
        firstParticleFrame = currentFrame;
        hasCompletedFirstCycle = false;
      }

      addFreePoint(currentFrame, x, y);
    }

    // --- POINTER EVENTS ---
    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return; 
      if (penMode) { penPointerDown(e); return; }
      if (activePointerId !== null) return; 

      activePointerId = e.pointerId;
      isDrawing = true;
      strokeRecordingActive = true;
      hideBrushPreview();

      if (editMode) {
        // Per-frame edit: keep the playhead parked so the stroke lands on the
        // currently selected frame only. The loop stays paused.
        isPlaying = false;
      } else {
        isPlaying = true;
        if (isSyncActive) {
          playheadPos = 0;
          currentFrame = 0;
          firstParticle = null;
          firstParticleFrame = null;
          hasCompletedFirstCycle = false;
        }
      }

      targetX = currentX = lastSpatialX = e.clientX * dpr;
      targetY = currentY = lastSpatialY = e.clientY * dpr;
      addPoint(currentX, currentY);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || e.pointerId !== activePointerId) return; 
      targetX = e.clientX * dpr;
      targetY = e.clientY * dpr;
    });

    function endStroke(e) {
      if (e.pointerId === activePointerId) {
        isDrawing = false;
        strokeRecordingActive = false;
        activePointerId = null;
        if (e.pointerType !== 'touch') showBrushPreview(e.clientX, e.clientY);
      }
    }

    window.addEventListener('pointerup', endStroke);
    window.addEventListener('pointercancel', endStroke);

    // --- Brush size/color preview ring (desktop, before drawing) ---
    const brushPreview = document.getElementById('brush-preview');
    function showBrushPreview(cx, cy) {
      // On-screen diameter matches the drawn dab (base size is in CSS px).
      const d = Math.max(2, parseFloat(sizeSlider.value));
      const col = colorPicker.value;
      brushPreview.style.width = d + 'px';
      brushPreview.style.height = d + 'px';
      brushPreview.style.left = cx + 'px';
      brushPreview.style.top = cy + 'px';
      brushPreview.style.borderColor = col;
      brushPreview.style.background = col + '30'; // ~19% alpha fill
      brushPreview.style.display = 'block';
    }
    function hideBrushPreview() { brushPreview.style.display = 'none'; }

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      if (penMode) { penPointerMove(e); return; }
      if (isDrawing) { hideBrushPreview(); return; }
      showBrushPreview(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', () => {
      hideBrushPreview();
      if (penMode) { penHoverPos = null; drawPenOverlay(); }
    });
    // Keep the ring in sync when size/color change while hovering.
    sizeSlider.addEventListener('input', () => {
      if (brushPreview.style.display === 'block') {
        brushPreview.style.width = Math.max(2, parseFloat(sizeSlider.value)) + 'px';
        brushPreview.style.height = brushPreview.style.width;
      }
    });
    colorPicker.addEventListener('input', () => {
      if (brushPreview.style.display === 'block') {
        brushPreview.style.borderColor = colorPicker.value;
        brushPreview.style.background = colorPicker.value + '30';
      }
    });

    // ================= Beginner Pen Tool (auto-smoothed path) =================
    const penOverlay = document.getElementById('pen-overlay');
    const penCtx = penOverlay.getContext('2d');
    const toolTabs = document.getElementById('tool-tabs');
    const toolTabBtns = toolTabs.querySelectorAll('.tool-tab');
    const penSmoothSlider = document.getElementById('pen-smooth');
    const valSmooth = document.getElementById('val-smooth');
    const penSmoothGroup = document.getElementById('pen-smooth-group');

    // Tool cycles Brush -> Pen -> Edit. penMode = any pen tool active.
    let penTool = 'brush';
    let penMode = false;        // penTool !== 'brush'
    let penEditing = false;     // penTool === 'edit' (adjust existing anchors only)
    let penAnchors = [];        // active path anchors, {x,y} in CSS px
    let penDragIndex = -1;
    let penHoverPos = null;     // {x,y} in CSS px
    let penClosed = false;
    let penSmoothness = parseInt(penSmoothSlider.value, 10) / 100;
    let penEditSettings = null; // {color,size,soft,curve} for the active path
    let penEditBackup = null;   // original of a committed path being re-edited (for cancel)
    const PEN_HIT = 12;

    // Long-press to finish a path (touch / Apple Pencil friendly, since double-tap
    // is unreliable with a stylus). Hold still for PEN_LONGPRESS_MS to commit.
    const PEN_LONGPRESS_MS = 500;
    const PEN_LONGPRESS_MOVE = 12; // px of movement that cancels the hold
    let penLongPressTimer = null;
    let penPressPos = null;
    let penLastPointerType = 'mouse';
    function cancelPenLongPress() {
      if (penLongPressTimer) { clearTimeout(penLongPressTimer); penLongPressTimer = null; }
      penPressPos = null;
    }
    function schedulePenLongPress(x, y) {
      cancelPenLongPress();
      penPressPos = { x, y };
      penLongPressTimer = setTimeout(() => {
        penLongPressTimer = null; penPressPos = null;
        if (penMode && !penEditing && penAnchors.length >= 2) commitPenPath();
      }, PEN_LONGPRESS_MS);
    }

    // Catmull-Rom point blended toward the straight line by smoothness s (0..1).
    function penCR(p0, p1, p2, p3, t, s) {
      const lx = p1.x + (p2.x - p1.x) * t;
      const ly = p1.y + (p2.y - p1.y) * t;
      const t2 = t * t, t3 = t2 * t;
      const cx = 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3);
      const cy = 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3);
      return { x: lx + (cx - lx) * s, y: ly + (cy - ly) * s };
    }

    // Dense polyline through the anchors (smooth spline).
    function penDensePath(pts, closed, s) {
      const n = pts.length;
      if (n < 2) return pts.map(p => ({ x: p.x, y: p.y }));
      const get = (i) => closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
      const out = [];
      const segCount = closed ? n : n - 1;
      const SUB = 24;
      for (let i = 0; i < segCount; i++) {
        const p0 = get(i-1), p1 = get(i), p2 = get(i+1), p3 = get(i+2);
        for (let j = 0; j < SUB; j++) out.push(penCR(p0, p1, p2, p3, j / SUB, s));
      }
      out.push(closed ? { x: pts[0].x, y: pts[0].y } : { x: pts[n-1].x, y: pts[n-1].y });
      return out;
    }

    // Resample a polyline at fixed arc-length spacing.
    function penResample(poly, spacing) {
      if (poly.length === 0) return [];
      const out = [{ x: poly[0].x, y: poly[0].y }];
      let acc = 0;
      for (let i = 1; i < poly.length; i++) {
        let ax = poly[i-1].x, ay = poly[i-1].y;
        const bx = poly[i].x, by = poly[i].y;
        let seg = Math.hypot(bx - ax, by - ay);
        while (acc + seg >= spacing && seg > 1e-6) {
          const tt = (spacing - acc) / seg;
          ax = ax + (bx - ax) * tt;
          ay = ay + (by - ay) * tt;
          out.push({ x: ax, y: ay });
          seg = Math.hypot(bx - ax, by - ay);
          acc = 0;
        }
        acc += seg;
      }
      return out;
    }

    function drawPenOverlay() {
      const ctx = penCtx;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (!penMode) return;
      const col = (penEditSettings && penEditSettings.color) || colorPicker.value;
      const size = Math.max(2, (penEditSettings && penEditSettings.size) || parseFloat(sizeSlider.value));

      const HL = '#ffd54a'; // highlight/snap accent (gold)

      // Which anchor is under the cursor, for highlight + snap feedback.
      let hoverActiveIdx = -1;
      if (penHoverPos && penDragIndex < 0 && penAnchors.length) {
        const h = penNearest(penHoverPos.x, penHoverPos.y);
        if (h.idx >= 0 && h.dist <= PEN_HIT) hoverActiveIdx = h.idx;
      }
      let hoverCommitted = null;
      if (penEditing && penHoverPos && penDragIndex < 0 && !penAnchors.length) {
        const c = penNearestCommitted(penHoverPos.x, penHoverPos.y);
        if (c.pi >= 0 && c.dist <= PEN_HIT) hoverCommitted = c;
      }

      // Faint handles on committed paths so the user sees they can be edited.
      // The anchor nearest the cursor lights up (snap target) in Edit mode.
      if (!penAnchors.length) {
        for (let pi = 0; pi < penPaths.length; pi++) {
          const anchors = penPaths[pi].anchors;
          for (let ai = 0; ai < anchors.length; ai++) {
            const a = anchors[ai];
            const hot = hoverCommitted && hoverCommitted.pi === pi && hoverCommitted.ai === ai;
            if (hot) {
              ctx.beginPath(); ctx.arc(a.x, a.y, 11, 0, Math.PI * 2);
              ctx.strokeStyle = HL; ctx.lineWidth = 2; ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(a.x, a.y, hot ? 6.5 : 4, 0, Math.PI * 2);
            ctx.fillStyle = hot ? HL : 'rgba(255,255,255,0.28)';
            ctx.strokeStyle = hot ? '#000' : 'rgba(0,0,0,0.55)'; ctx.lineWidth = hot ? 2 : 1.5;
            ctx.fill(); ctx.stroke();
          }
        }
      }

      // Hovering the first (terminal) anchor offers to close the loop (pen only).
      const hoverClose = (!penEditing && !penClosed && penAnchors.length >= 3 && penHoverPos && penDragIndex < 0 &&
        Math.hypot(penAnchors[0].x - penHoverPos.x, penAnchors[0].y - penHoverPos.y) <= PEN_HIT);

      // Path preview (append the hovered point as a temp endpoint while open)
      let pts = penAnchors.slice();
      if (!penEditing && !penClosed && penDragIndex < 0 && penHoverPos && !hoverClose && hoverActiveIdx < 0) {
        pts = pts.concat([penHoverPos]);
      }
      if (pts.length >= 2) {
        const dense = penDensePath(pts, penClosed, penSmoothness);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.strokeStyle = col + '55'; ctx.lineWidth = size;        // brush-width band
        ctx.beginPath();
        dense.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 1.5;                // crisp centerline
        ctx.beginPath();
        dense.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
      }

      // Active anchor handles (first anchor is white = the terminal point).
      // The one under the cursor lights up with a snap ring.
      for (let i = 0; i < penAnchors.length; i++) {
        const a = penAnchors[i];
        const hot = (i === hoverActiveIdx);
        if (hot && i !== penDragIndex) {
          ctx.beginPath(); ctx.arc(a.x, a.y, 11, 0, Math.PI * 2);
          ctx.strokeStyle = HL; ctx.lineWidth = 2; ctx.stroke();
        }
        const r = (i === penDragIndex) ? 7 : (hot ? 6.5 : 5);
        ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
        ctx.fillStyle = hot ? HL : ((i === 0) ? '#ffffff' : col);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.fill(); ctx.stroke();
      }

      // "Close path" affordance ring around the terminal point on hover.
      if (hoverClose) {
        const a = penAnchors[0];
        ctx.beginPath(); ctx.arc(a.x, a.y, 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ff41'; ctx.lineWidth = 2.5; ctx.stroke();
      }

      // Brush-size ring at the cursor (pen placing only, not while snapping).
      if (!penEditing && penHoverPos && penDragIndex < 0 && !hoverClose && hoverActiveIdx < 0) {
        ctx.beginPath(); ctx.arc(penHoverPos.x, penHoverPos.y, size / 2, 0, Math.PI * 2);
        ctx.strokeStyle = col; ctx.lineWidth = 1.25; ctx.stroke();
      }

      // Hint so touch / Apple Pencil users know how to finish the path.
      if (!penEditing && penAnchors.length >= 2) {
        const last = penAnchors[penAnchors.length - 1];
        const label = penLastPointerType === 'mouse' ? 'Double-click to finish' : 'Hold to finish';
        ctx.font = '600 12px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const tw = ctx.measureText(label).width;
        let lx = last.x + 14, ly = last.y - 14;
        if (lx + tw + 12 > window.innerWidth) lx = last.x - tw - 26;
        if (ly < 12) ly = last.y + 22;
        ctx.fillStyle = 'rgba(0,0,0,0.62)';
        ctx.beginPath();
        (ctx.roundRect ? ctx.roundRect(lx - 7, ly - 10, tw + 14, 20, 5)
                       : ctx.rect(lx - 7, ly - 10, tw + 14, 20));
        ctx.fill();
        ctx.fillStyle = '#00ff41';
        ctx.fillText(label, lx, ly);
      }
    }

    // Nearest anchor within the ACTIVE path.
    function penNearest(x, y) {
      let idx = -1, best = Infinity;
      for (let i = 0; i < penAnchors.length; i++) {
        const d = Math.hypot(penAnchors[i].x - x, penAnchors[i].y - y);
        if (d < best) { best = d; idx = i; }
      }
      return { idx, dist: best };
    }

    // Nearest anchor across all COMMITTED paths (for re-editing).
    function penNearestCommitted(x, y) {
      let pi = -1, ai = -1, best = Infinity;
      for (let p = 0; p < penPaths.length; p++) {
        const anchors = penPaths[p].anchors;
        for (let i = 0; i < anchors.length; i++) {
          const d = Math.hypot(anchors[i].x - x, anchors[i].y - y);
          if (d < best) { best = d; pi = p; ai = i; }
        }
      }
      return { pi, ai, dist: best };
    }

    // Rebuild the live buffers from the free-draw layer + every committed path.
    function bakePathAcrossFrames(path) {
      const activeFrames = parseInt(framesSlider.value, 10);
      const devAnchors = path.anchors.map(p => ({ x: p.x * dpr, y: p.y * dpr }));
      const dense = penDensePath(devAnchors, path.closed, path.smoothness);
      const size = Math.max(2, path.size);
      const dabs = penResample(dense, Math.max(1, size * dpr * 0.15));
      const K = dabs.length;
      if (K < 1) return;
      const rgb = hexToRgb(path.color);
      const dsize = size * dpr;
      const cs = path.curve || {};
      for (let k = 0; k < K; k++) {
        const prog = K > 1 ? k / (K - 1) : 0;
        let f = Math.floor(prog * activeFrames);
        if (f >= activeFrames) f = activeFrames - 1;
        // Sample the curve at the dab's continuous position along the path (prog)
        // rather than its quantized frame, so scaling varies smoothly instead of
        // stepping at each frame boundary. (Frozen per-path in path.curve.)
        const m = computeModAtX(prog, cs.enabled, cs.param, cs.lut);
        let px = dabs[k].x, py = dabs[k].y;
        if (m.noiseAmt > 0) { px += (Math.random() - 0.5) * m.noiseAmt; py += (Math.random() - 0.5) * m.noiseAmt; }
        frameData[f].push(px, py, rgb[0], rgb[1], rgb[2], dsize * m.sizeMul, m.blurAdd, path.soft + m.softAdd, m.alphaMul);
        frameNeedsUpdate[f] = true;
      }
    }

    function rebakePen() {
      for (let f = 0; f < MAX_FRAMES; f++) { frameData[f] = freeData[f].slice(); frameNeedsUpdate[f] = true; }
      for (const path of penPaths) bakePathAcrossFrames(path);
    }

    // Pull a committed path back onto the canvas as the active, editable path.
    function syncSmoothSlider() {
      penSmoothSlider.value = Math.round(penSmoothness * 100);
      valSmooth.innerText = penSmoothSlider.value;
      updateRangeFill(penSmoothSlider);
    }

    function beginEditPath(pathIndex, anchorIndex) {
      const path = penPaths.splice(pathIndex, 1)[0];
      penEditBackup = path; // restore this exact object if the edit is cancelled
      penAnchors = path.anchors.map(p => ({ x: p.x, y: p.y }));
      penClosed = path.closed;
      penSmoothness = path.smoothness;
      penEditSettings = { color: path.color, size: path.size, soft: path.soft, curve: path.curve };
      syncSmoothSlider();
      rebakePen(); // remove it from the baked art; it now lives in the overlay
      if (typeof anchorIndex === 'number') penDragIndex = anchorIndex;
      drawPenOverlay();
    }

    function penPointerDown(e) {
      if (e.button === 2) return; // removal is handled by contextmenu
      penLastPointerType = e.pointerType || penLastPointerType;
      cancelPenLongPress();
      const x = e.clientX, y = e.clientY;

      // Grab an anchor on the ACTIVE path (drag it; or close it in pen mode).
      if (penAnchors.length) {
        const hit = penNearest(x, y);
        if (hit.idx >= 0 && hit.dist <= PEN_HIT) {
          if (!penEditing && hit.idx === 0 && penAnchors.length >= 3 && !penClosed) {
            penClosed = true; drawPenOverlay(); return; // close loop (pen mode)
          }
          penDragIndex = hit.idx;
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
          drawPenOverlay();
          return;
        }
      }

      if (penEditing) {
        // EDIT mode: only adjust existing paths, never create new anchors.
        if (!penAnchors.length) {
          const c = penNearestCommitted(x, y);
          if (c.pi >= 0 && c.dist <= PEN_HIT) {
            beginEditPath(c.pi, c.ai);
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
          }
        } else {
          // Clicking empty space finalizes the path currently being edited.
          commitPenPath();
        }
        return;
      }

      // PEN mode: place a new anchor (start or extend the path).
      if (!penClosed) {
        if (!penAnchors.length && !penEditSettings) {
          penEditSettings = {
            color: colorPicker.value,
            size: Math.max(2, parseFloat(sizeSlider.value)),
            soft: parseFloat(softSlider.value),
            curve: currentCurveSnapshot()
          };
        }
        penAnchors.push({ x, y });
        // Stylus/touch: hold still after placing a point to finish the path.
        if (e.pointerType !== 'mouse') schedulePenLongPress(x, y);
        drawPenOverlay();
      }
    }

    function penPointerMove(e) {
      penLastPointerType = e.pointerType || penLastPointerType;
      penHoverPos = { x: e.clientX, y: e.clientY };
      if (penDragIndex >= 0) {
        penAnchors[penDragIndex] = { x: e.clientX, y: e.clientY };
        cancelPenLongPress(); // dragging an anchor isn't a hold-to-finish
      } else if (penPressPos &&
                 Math.hypot(e.clientX - penPressPos.x, e.clientY - penPressPos.y) > PEN_LONGPRESS_MOVE) {
        cancelPenLongPress(); // moved too far — treat as drawing, not a hold
      }
      drawPenOverlay();
    }

    function penPointerUp(e) {
      cancelPenLongPress(); // lifting early = a normal tap, not a hold-to-finish
      if (penDragIndex >= 0) {
        penDragIndex = -1;
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        drawPenOverlay();
      }
    }
    window.addEventListener('pointerup', penPointerUp);
    window.addEventListener('pointercancel', penPointerUp);

    // Right-click removes the nearest anchor on the active path.
    canvas.addEventListener('contextmenu', (e) => {
      if (!penMode || !penAnchors.length) return;
      e.preventDefault();
      const hit = penNearest(e.clientX, e.clientY);
      if (hit.idx >= 0 && hit.dist <= PEN_HIT) {
        penAnchors.splice(hit.idx, 1);
        if (penAnchors.length < 3 && penClosed) penClosed = false;
        drawPenOverlay();
      }
    });

    // Double-click finishes (commits) the current path.
    canvas.addEventListener('dblclick', (e) => {
      if (!penMode) return;
      e.preventDefault();
      // The two clicks of a double-click add a near-duplicate anchor; drop it.
      if (penAnchors.length >= 2) {
        const n = penAnchors.length;
        if (Math.hypot(penAnchors[n-1].x - penAnchors[n-2].x, penAnchors[n-1].y - penAnchors[n-2].y) < PEN_HIT) {
          penAnchors.pop();
        }
      }
      commitPenPath();
    });

    function resetActivePen() {
      penAnchors = []; penDragIndex = -1; penClosed = false;
      penEditSettings = null; penEditBackup = null;
    }

    // Cancel the active path. If we were re-editing a committed path, put it back.
    function clearPen() {
      if (penEditBackup) { penPaths.push(penEditBackup); rebakePen(); }
      resetActivePen();
      penHoverPos = null;
      drawPenOverlay();
    }

    // Finish the active path: store it as an editable path and bake it in.
    function commitPenPath() {
      if (penAnchors.length < 2) { clearPen(); return; }
      const s = penEditSettings || {
        color: colorPicker.value,
        size: Math.max(2, parseFloat(sizeSlider.value)),
        soft: parseFloat(softSlider.value),
        curve: currentCurveSnapshot()
      };
      penPaths.push({
        anchors: penAnchors.map(p => ({ x: p.x, y: p.y })),
        closed: penClosed, smoothness: penSmoothness,
        color: s.color, size: s.size, soft: s.soft,
        curve: s.curve || currentCurveSnapshot()
      });
      resetActivePen();
      rebakePen();
      if (!penEditing) { isPlaying = true; updatePlayBtn(); } // show the draw-on reveal
      drawPenOverlay();
    }

    // Tool tabs select the active tool: Brush / Pen / Edit.
    function setPenTool(tool) {
      if (tool === penTool) return;
      if (penMode) commitPenPath();   // finalize any in-progress path first
      penTool = tool;
      penMode = tool !== 'brush';
      penEditing = tool === 'edit';
      penOverlay.style.display = penMode ? 'block' : 'none';
      penSmoothGroup.style.display = penMode ? '' : 'none';
      // Show the real cursor in Edit mode; Brush/Pen use their own on-canvas rings.
      canvas.style.cursor = penEditing ? 'default' : 'none';
      toolTabBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
      if (penMode) {
        hideBrushPreview();
        syncSmoothSlider();
      }
      if (tool === 'edit') { isPlaying = false; updatePlayBtn(); } // static canvas while editing
      drawPenOverlay();
    }

    toolTabBtns.forEach(b => b.addEventListener('click', () => setPenTool(b.dataset.tool)));

    penSmoothSlider.addEventListener('input', () => {
      penSmoothness = parseInt(penSmoothSlider.value, 10) / 100;
      valSmooth.innerText = penSmoothSlider.value;
      updateRangeFill(penSmoothSlider);
      drawPenOverlay(); // live-reshape the active path
    });

    // While in a pen tool: Enter finishes the path, Esc cancels it.
    window.addEventListener('keydown', (e) => {
      if (!penMode) return;
      if (e.key === 'Enter') { e.preventDefault(); commitPenPath(); }
      else if (e.key === 'Escape') { e.preventDefault(); clearPen(); }
    });

    // --- Scroll wheel scrubbing (only while in per-frame edit mode) ---
    // Scroll up = step forward, scroll down = step backward. Hold Shift for 5 frames.
    // Deltas are accumulated against a threshold so scrubbing isn't hyper-sensitive.
    let wheelAccum = 0;
    const WHEEL_THRESHOLD = 80;
    window.addEventListener('wheel', (e) => {
      if (!editMode) return;
      e.preventDefault();
      wheelAccum += e.deltaY;
      if (Math.abs(wheelAccum) < WHEEL_THRESHOLD) return;
      const activeFrames = parseInt(framesSlider.value, 10);
      const step = e.shiftKey ? 5 : 1;
      const dir = wheelAccum > 0 ? -1 : 1; // scroll up (negative delta) = forward
      currentFrame = ((currentFrame + dir * step) % activeFrames + activeFrames) % activeFrames;
      playheadPos = currentFrame;
      wheelAccum = 0;
    }, { passive: false });

    // --- Spacebar toggles play/pause (not the panel) ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault(); // stop space from activating a focused button
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        if (editMode) {
          editMode = false;
          isPlaying = true;
        } else {
          isPlaying = !isPlaying;
        }
        updateEditModeUI();
        updatePlayBtn();
      }
    });

    // Wire up the interleaved vertex attributes for the currently bound buffer.
    function bindPointAttribs() {
      const stride = floatsPerPoint * 4;
      gl.vertexAttribPointer(a_pos, 2, gl.FLOAT, false, stride, 0);
      gl.enableVertexAttribArray(a_pos);
      gl.vertexAttribPointer(a_col, 3, gl.FLOAT, false, stride, 2 * 4);
      gl.enableVertexAttribArray(a_col);
      gl.vertexAttribPointer(a_size, 1, gl.FLOAT, false, stride, 5 * 4);
      gl.enableVertexAttribArray(a_size);
      gl.vertexAttribPointer(a_pBlur, 1, gl.FLOAT, false, stride, 6 * 4);
      gl.enableVertexAttribArray(a_pBlur);
      gl.vertexAttribPointer(a_pSoft, 1, gl.FLOAT, false, stride, 7 * 4);
      gl.enableVertexAttribArray(a_pSoft);
      gl.vertexAttribPointer(a_pAlpha, 1, gl.FLOAT, false, stride, 8 * 4);
      gl.enableVertexAttribArray(a_pAlpha);
    }

    function drawFramePoints(frameIndex, alpha, blur, sizeOffset) {
      const data = frameData[frameIndex];
      const numPoints = data.length / floatsPerPoint;
      if (numPoints === 0) return;

      gl.bindBuffer(gl.ARRAY_BUFFER, frameBuffers[frameIndex]);
      if (frameNeedsUpdate[frameIndex]) {
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.DYNAMIC_DRAW);
        frameNeedsUpdate[frameIndex] = false;
      }
      bindPointAttribs();
      gl.uniform1f(u_alpha, alpha);
      gl.uniform1f(u_blur, blur);
      gl.uniform1f(u_size, sizeOffset);
      gl.drawArrays(gl.POINTS, 0, numPoints);
    }

    // --- Render Loop ---
    function tick() {
      const activeFrames = parseInt(framesSlider.value, 10);
      const speed = parseFloat(speedSlider.value);
      
      let prevFrame = currentFrame;
      
      if (isPlaying) {
        playheadPos = (playheadPos + speed) % activeFrames;
        currentFrame = Math.floor(playheadPos);
      }

      if (firstParticleFrame !== null && prevFrame > currentFrame) {
        hasCompletedFirstCycle = true;
        
        if (isSyncActive && isDrawing) {
          strokeRecordingActive = false; 
        }
      }

      if (isDrawing && strokeRecordingActive) {
        currentX += (targetX - currentX) * 0.25;
        currentY += (targetY - currentY) * 0.25;
      }

      if (isDrawing && strokeRecordingActive && currentFrame !== prevFrame) {
        let framesElapsed = currentFrame - prevFrame;
        if (framesElapsed < 0) framesElapsed += activeFrames;
        
        for(let i = 1; i <= framesElapsed; i++) {
          let f = (prevFrame + i) % activeFrames;
          addFreePoint(f, currentX, currentY);
        }
        lastSpatialX = currentX;
        lastSpatialY = currentY;
      }

      if (isDrawing && strokeRecordingActive) {
        const dx = currentX - lastSpatialX;
        const dy = currentY - lastSpatialY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const brushSpacing = parseFloat(sizeSlider.value) * dpr * 0.12; 
        
        if (dist > brushSpacing) {
          const steps = Math.floor(dist / brushSpacing);
          for(let i = 1; i <= steps; i++) {
            addPoint(lastSpatialX + dx * (i / steps), lastSpatialY + dy * (i / steps));
          }
          lastSpatialX = currentX;
          lastSpatialY = currentY;
        }
      }

      updatePlayBtn();

      for (let i = 0; i < frameSteps.length; i++) {
        if (i === currentFrame) {
          frameSteps[i].classList.add('active');
        } else {
          frameSteps[i].classList.remove('active');
        }
      }

      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0.0, 0.0, 0.0, 0.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // Keep the curve editor's playhead marker in sync (visual only).
      if (!curvePanel.classList.contains('hidden')) drawCurveEditor();

      gl.uniform2f(u_res, canvas.width, canvas.height);
      gl.uniform1f(u_baseOp, parseFloat(opacitySlider.value));

      const rawTrailVal = parseInt(trailSlider.value, 10);
      let trailLength = Math.min(rawTrailVal, activeFrames);
      // "Trail Length" curve scaling is a live render effect (it can't be baked
      // per-point), scaling the trail from 0 up to the slider length over the loop.
      if (curveEnabled && curveParam === 'trail') {
        const cv = sampleCurve(activeFrames > 0 ? (playheadPos / activeFrames) : 0);
        trailLength = Math.round(cv * trailLength);
      }
      const maxBlur = parseFloat(blurSlider.value);

      if (editMode) {
        // Onion skinning while editing a single frame: only the current frame is
        // fully drawn; a couple of neighbouring frames appear faintly for reference.
        const onionRange = 2;
        for (let d = onionRange; d >= 1; d--) {
          const fade = 0.30 * (1 - (d - 1) / onionRange) + 0.05;
          const prevI = ((currentFrame - d) % activeFrames + activeFrames) % activeFrames;
          const nextI = (currentFrame + d) % activeFrames;
          drawFramePoints(prevI, fade, 0.0, 0.0);
          if (nextI !== prevI) drawFramePoints(nextI, fade, 0.0, 0.0);
        }
        drawFramePoints(currentFrame, 1.0, 0.0, 0.0);
      } else {
        for (let dist = trailLength; dist >= 0; dist--) {
          const frameIndex = ((currentFrame - dist) % activeFrames + activeFrames) % activeFrames;

          let alpha = 1.0;
          let blur = 0.0;

          if (dist > 0 && trailLength > 0) {
            alpha = 1.0 - (dist / trailLength);
            blur = (dist / trailLength) * maxBlur;
          }

          drawFramePoints(frameIndex, alpha, blur, 0.0);
        }
      }

      if (!editMode && firstParticle && !hasCompletedFirstCycle) {
        gl.bindBuffer(gl.ARRAY_BUFFER, ghostBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(firstParticle), gl.STREAM_DRAW);

        bindPointAttribs();

        gl.uniform1f(u_alpha, 0.45);
        gl.uniform1f(u_blur, 2.0);
        gl.uniform1f(u_size, 0.3);

        gl.drawArrays(gl.POINTS, 0, 1);
      }
      
      // Native Export Frame Tracking
      if (isRecording) {
        recordingTickCount++;
        if (recordingTickCount >= requiredTicks && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
